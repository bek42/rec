name: Bump version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    if: "!startsWith(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v3
        with:
          token: "${{ secrets.PERSONAL_ACCESS_TOKEN }}"
          fetch-depth: 0
      - name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          changelog_increment_filename: body.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "body.md"
          tag_name: ${{ env.REVISION }}
        env:
          # The workflow's own token, unlike PERSONAL_ACCESS_TOKEN above (which
          # is still needed for checkout/commitizen-action's push - a bump
          # commit/tag pushed with the default GITHUB_TOKEN wouldn't trigger
          # release.yml, due to GitHub's actions-triggering-actions loop guard).
          # Release creation itself just needs contents:write, which this
          # workflow now grants the job directly, sidestepping whatever scope
          # PERSONAL_ACCESS_TOKEN is missing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
